# ===========================================
# ChurchShare Backend Application Properties
# ===========================================
# Default configuration - override with environment variables in production

# ===========================================
# Server Configuration
# ===========================================
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

# ===========================================
# Application Info
# ===========================================
spring.application.name=churchshare-backend
spring.banner.location=classpath:banner.txt

# ===========================================
# Database Configuration (PostgreSQL)
# ===========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:churchshare_db}
spring.datasource.username=${DB_USERNAME:churchshare}
spring.datasource.password=${DB_PASSWORD:churchshare_password}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===========================================
# JPA Configuration
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ===========================================
# Flyway Migration
# ===========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,file:./db/migration
spring.flyway.validate-on-migrate=true

# ===========================================
# JWT Configuration
# ===========================================
# Generate a strong secret: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-in-production-min-32-chars}
app.jwt.expiration-ms=86400000
app.jwt.issuer=churchshare
app.jwt.audience=churchshare-app

# ===========================================
# Cloudflare R2 Storage Configuration (S3 Compatible)
# ===========================================
app.storage.r2.endpoint=${R2_ENDPOINT:https://your-account.r2.cloudflarestorage.com}
app.storage.r2.access-key=${R2_ACCESS_KEY:your-r2-access-key}
app.storage.r2.secret-key=${R2_SECRET_KEY:your-r2-secret-key}
app.storage.r2.bucket-name=${R2_BUCKET_NAME:churchshare-bucket}

# File upload limits
app.storage.max-file-size=10485760
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true

# ===========================================
# Base URL Configuration
# ===========================================
app.base-url=${BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ===========================================
# CORS Configuration
# ===========================================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000},http://localhost:80,https://churchshare.app
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===========================================
# Spring Security Configuration
# ===========================================
spring.security.filter.order=5

# ===========================================
# Actuator Endpoints
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# ===========================================
# Logging Configuration
# ===========================================
logging.level.root=INFO
logging.level.com.churchshare=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/churchshare.log
logging.file.max-size=10MB
logging.file.max-history=30

# ===========================================
# Application Info (for /actuator/info)
# ===========================================
info.app.name=ChurchShare Backend
info.app.description=Church Resource Sharing Platform
info.app.version=1.0.0-SNAPSHOT
info.app.java.version=${java.version}

# ===========================================
# Development Profile Defaults
# ===========================================
# Override these in application-docker.properties or application-prod.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}
