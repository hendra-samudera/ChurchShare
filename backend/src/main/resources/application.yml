spring:
  application:
    name: churchshare-backend

  # =============================================================================
  # Database Configuration
  # =============================================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/churchshare}
    username: ${SPRING_DATASOURCE_USERNAME:churchshare}
    password: ${SPRING_DATASOURCE_PASSWORD:churchshare_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
    open-in-view: false

  # =============================================================================
  # Flyway Migrations
  # =============================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

  # =============================================================================
  # Jackson JSON Configuration
  # =============================================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: com.churchshare.common.config.Iso8601DateFormat
    time-zone: UTC

  # =============================================================================
  # File Upload Configuration
  # =============================================================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

# =============================================================================
# Server Configuration
# =============================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful
  forward-headers-strategy: framework

# =============================================================================
# Spring Security
# =============================================================================
spring-security:
  filter:
    order: 5

# =============================================================================
# JWT Configuration
# =============================================================================
jwt:
  secret: ${JWT_SECRET:churchshare_dev_jwt_secret_key_please_change_in_production}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  token-prefix: "Bearer "
  header: "Authorization"

# =============================================================================
# Storage Configuration (R2/MinIO)
# =============================================================================
storage:
  type: ${STORAGE_TYPE:minio}
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  bucket: ${STORAGE_BUCKET:churchshare-dev}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin_secret}
  region: ${STORAGE_REGION:auto}
  presign-duration-minutes: 15

# =============================================================================
# CORS Configuration
# =============================================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

# =============================================================================
# Actuator Configuration
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level:
    root: INFO
    com.churchshare: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/churchshare.log
    max-size: 10MB
    max-history: 30

# =============================================================================
# Application Info
# =============================================================================
info:
  app:
    name: ChurchShare Backend
    description: Zero-download PDF sharing platform for church congregations
    version: 1.0.0-SNAPSHOT
    java-version: ${java.version}
