# ===========================================
# ChurchShare Production Application Properties
# ===========================================
# Production-specific configuration
# Profile: prod
# ===========================================

# ===========================================
# Server Configuration
# ===========================================
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# ===========================================
# Application Info
# ===========================================
spring.application.name=churchshare-backend

# ===========================================
# Database Configuration (PostgreSQL)
# ===========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/churchshare_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:churchshare}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Connection Pool (HikariCP) - Production Optimized
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ===========================================
# JPA Configuration
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ===========================================
# Flyway Migration
# ===========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===========================================
# JWT Configuration - Production
# ===========================================
# CRITICAL: Set strong secret via environment variable
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=churchshare
app.jwt.audience=churchshare-app

# ===========================================
# Cloudflare R2 Storage Configuration
# ===========================================
app.storage.r2.endpoint=${R2_ENDPOINT}
app.storage.r2.access-key=${R2_ACCESS_KEY}
app.storage.r2.secret-key=${R2_SECRET_KEY}
app.storage.r2.bucket-name=${R2_BUCKET_NAME}

# File upload limits - Production
app.storage.max-file-size=10485760
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true

# ===========================================
# Base URL Configuration
# ===========================================
app.base-url=${BACKEND_URL:https://your-domain.com/api}
app.frontend-url=${FRONTEND_URL:https://your-domain.com}

# ===========================================
# CORS Configuration - Production
# ===========================================
# Restrict to production domain only
app.cors.allowed-origins=${FRONTEND_URL:https://your-domain.com}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,X-Frame-Options
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===========================================
# Spring Security Configuration
# ===========================================
spring.security.filter.order=5

# ===========================================
# Actuator Endpoints - Production
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true
management.server.port=8080
management.server.address=0.0.0.0

# ===========================================
# Logging Configuration - Production
# ===========================================
# Production logging levels
logging.level.root=INFO
logging.level.com.churchshare=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.jdbc=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=WARN

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File logging
logging.file.name=logs/churchshare.log
logging.file.max-size=50MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# ===========================================
# Application Info (for /actuator/info)
# ===========================================
info.app.name=ChurchShare Backend
info.app.description=Church Resource Sharing Platform
info.app.version=1.0.0
info.app.java.version=${java.version}
info.app.profile=production

# ===========================================
# Performance Tuning
# ===========================================
# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# ===========================================
# Cache Configuration
# ===========================================
spring.cache.type=none

# ===========================================
# Request/Response Configuration
# ===========================================
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss
spring.mvc.format.time=HH:mm:ss

# ===========================================
# Health Indicators
# ===========================================
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# ===========================================
# Production-Specific Settings
# ===========================================
# Disable development features
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Enable graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
