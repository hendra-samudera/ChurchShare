spring:
  config:
    activate:
      on-profile: prod

  # Production database (should be configured via environment variables)
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  # Disable SQL logging in production
  jpa:
    show-sql: false

# Production logging
logging:
  level:
    root: WARN
    com.churchshare: INFO
    org.springframework.web: WARN
    org.springframework.security: INFO

# Production CORS (configure via environment)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://churchshare.app}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Content-Type,Authorization
  allow-credentials: true
  max-age: 7200

# Production security
jwt:
  secret: ${JWT_SECRET}  # Must be set in production
  expiration-ms: 604800000
