# ChurchShare Backend Test Configuration
# Application properties for test profile

# Database Configuration (Testcontainers will override these)
spring.datasource.url=jdbc:postgresql://localhost:5432/churchshare_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration (disabled for tests)
spring.flyway.enabled=false

# JWT Configuration
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW5zLXRoYXQtaXMtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZw==
app.jwt.expiration-ms=3600000

# Storage Configuration (mocked in tests)
app.storage.r2.endpoint=https://r2.example.com
app.storage.r2.access-key=test-access-key
app.storage.r2.secret-key=test-secret-key
app.storage.r2.bucket-name=test-bucket

# File Upload Configuration
app.storage.max-file-size=20971520

# Base URL
app.base-url=http://localhost:8080

# Logging Configuration
logging.level.com.churchshare=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

# Server Configuration
server.port=0
