<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    
    <!-- Viewport for mobile devices - allows user scaling for accessibility -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, minimum-scale=1, user-scalable=yes" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#4a6cf7" />
    
    <!-- Description -->
    <meta
      name="description"
      content="ChurchShare - Share church resources easily. View PDFs directly in your browser without downloading."
    />
    
    <!-- Accessibility: Prefer reduced motion -->
    <meta name="prefers-reduced-motion" content="reduce" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Mobile browser optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ChurchShare" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- High contrast support hint -->
    <meta name="color-scheme" content="light dark" />
    
    <title>ChurchShare - Document Viewer</title>
  </head>
  <body>
    <!-- Skip link for keyboard navigation -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <noscript>
      <div style="padding: 2rem; text-align: center; font-size: 1.25rem;">
        <h1>JavaScript Required</h1>
        <p>ChurchShare requires JavaScript to view documents. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    
    <div id="root"></div>
  </body>
</html>
