services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: churchshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: churchshare
      POSTGRES_USER: churchshare
      POSTGRES_PASSWORD: churchshare_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churchshare -d churchshare"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - churchshare-network

  # =============================================================================
  # MinIO (S3-compatible storage for local R2 simulation)
  # =============================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-07T00-31-49Z
    container_name: churchshare-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - churchshare-network

  # =============================================================================
  # MinIO Bucket Initialization
  # =============================================================================
  minio-init:
    image: minio/mc:RELEASE.2024-03-07T00-31-49Z
    container_name: churchshare-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 3;
      mc alias set myminio http://minio:9000 minioadmin minioadmin_secret;
      mc mb --ignore-existing myminio/churchshare-dev;
      mc anonymous set none myminio/churchshare-dev;
      echo 'MinIO bucket created: churchshare-dev';
      exit 0;
      "
    networks:
      - churchshare-network

  # =============================================================================
  # Spring Boot Backend
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: churchshare-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churchshare
      SPRING_DATASOURCE_USERNAME: churchshare
      SPRING_DATASOURCE_PASSWORD: churchshare_dev_password
      SPRING_FLYWAY_ENABLED: "true"
      STORAGE_TYPE: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: churchshare-dev
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin_secret
      STORAGE_REGION: auto
      JWT_SECRET: churchshare_dev_jwt_secret_key_please_change_in_production
      JWT_EXPIRATION_MS: 604800000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - churchshare-network

  # =============================================================================
  # Angular Frontend (Development Server)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: development
    container_name: churchshare-frontend
    restart: unless-stopped
    environment:
      NG_HOST: 0.0.0.0
      NG_PORT: 4200
      NG_POLL: 1000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/angular.json:/app/angular.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - churchshare-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  churchshare-network:
    driver: bridge
