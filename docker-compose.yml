version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: churchshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-churchshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churchshare_password}
      POSTGRES_DB: ${POSTGRES_DB:-churchshare_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - churchshare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churchshare} -d ${POSTGRES_DB:-churchshare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churchshare-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-churchshare_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-churchshare}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-churchshare_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://your-account.r2.cloudflarestorage.com}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-your-r2-access-key}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-your-r2-secret-key}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-churchshare-bucket}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - churchshare-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: churchshare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - churchshare-network

networks:
  churchshare-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  nginx_ssl:
    driver: local
