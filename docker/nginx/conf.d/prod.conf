# ===========================================
# ChurchShare Nginx Production Configuration
# ===========================================
# Production-ready Nginx configuration with:
# - SSL termination
# - Security headers
# - Gzip compression
# - Rate limiting
# - Caching
# ===========================================

# Upstream backend configuration
upstream backend {
    server backend:8080;
    keepalive 32;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint (no redirect)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SERVER_NAME:-localhost};

    # ===========================================
    # SSL Configuration
    # ===========================================
    ssl_certificate /etc/nginx/ssl/live/${SERVER_NAME:-localhost}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/${SERVER_NAME:-localhost}/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/${SERVER_NAME:-localhost}/chain.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ===========================================
    # Security Headers
    # ===========================================
    # HSTS (max-age=1 year, include subdomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ===========================================
    # Logging
    # ===========================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ===========================================
    # Performance Settings
    # ===========================================
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    keepalive_requests 100;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ===========================================
    # Gzip Compression
    # ===========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml font/truetype font/opentype application/x-font-ttf application/x-font-otf;

    # ===========================================
    # Frontend Static Files
    # ===========================================
    location / {
        # Rate limiting
        limit_req zone=general_limit burst=20 nodelay;

        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Try files for SPA routing
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Security headers for static files
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ===========================================
    # API Proxy to Spring Boot Backend
    # ===========================================
    location /api/ {
        # Rate limiting for API
        limit_req zone=api_limit burst=10 nodelay;

        # Proxy settings
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;
    }

    # ===========================================
    # Actuator Endpoints (Health Checks)
    # ===========================================
    location /actuator/ {
        proxy_pass http://backend/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Allow health endpoint without authentication
        location /actuator/health {
            proxy_pass http://backend/actuator/health;
            access_log off;
        }
    }

    # ===========================================
    # WebSocket Support
    # ===========================================
    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ===========================================
    # Deny Access to Hidden Files
    # ===========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===========================================
    # Deny Access to Sensitive Files
    # ===========================================
    location ~* \.(git|svn|env|bak|old|tmp|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===========================================
    # Error Pages
    # ===========================================
    error_page 400 /400.html;
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 405 /405.html;
    error_page 408 /408.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;

    location = /400.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    location = /401.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    location = /403.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    location = /404.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html/errors;
        internal;
    }
}
